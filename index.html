<title>Котельная 3×2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Макет: полноэкранная 3D-сцена, сверху название и кнопки AR/VR, снизу переключатели слоёв и видов. */
  :root {
    --bg: #e9ecef; --scene: #dfe4e9; --panel: #ffffff; --fg: #1d2329; --muted: #5d6874;
    --line: #c6cdd5; --accent: #c4561b; --accent-fg: #ffffff;
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161a; --scene: #1b2026; --panel: #232a31; --fg: #eaeef2; --muted: #9aa5b1;
      --line: #38424c; --accent: #f08a4b; --accent-fg: #1b1208; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161a; --scene: #1b2026; --panel: #232a31; --fg: #eaeef2; --muted: #9aa5b1;
    --line: #38424c; --accent: #f08a4b; --accent-fg: #1b1208; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--scene); }
  #ui {
    position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: space-between;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  #ui > * { pointer-events: none; }
  .title, .xr, #status, .row, #info { pointer-events: auto; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 600; line-height: 1.2; }
  h1 small { display: block; font: 500 0.72rem/1.4 var(--mono); color: var(--muted); letter-spacing: 0.02em; margin-top: 2px; }
  .title { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
  .xr { display: flex; gap: 8px; }
  button {
    font: 600 0.85rem var(--font); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 14px; min-height: 40px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }
  #btn-ar { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  #status {
    align-self: flex-start; max-width: min(34rem, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; font-size: 0.8rem; line-height: 1.4; color: var(--muted);
  }
  #info { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: grid; gap: 2px; max-width: min(30rem, 100%); }
  #info strong { font-size: 0.88rem; font-weight: 600; line-height: 1.3; }
  #info-size { font: 600 1.1rem var(--mono); color: var(--accent); }
  #info-mat { font-size: 0.75rem; color: var(--muted); }
  footer { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .row button { flex: none; font-weight: 500; font-size: 0.8rem; padding: 7px 12px; min-height: 36px; }
  .row .lbl { flex: none; align-self: center; font: 500 0.68rem var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-right: 2px; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  @media (prefers-reduced-motion: no-preference) { button { transition: background 0.12s, color 0.12s; } }
</style>

    inXR = false; xr.active = false; xr.mode = null; xr.grab = null; xr.grip = [false, false]; hideScale();
    if (xr.hint) { scene.remove(xr.hint); xr.hint = null; }
    pivot.position.set(1.5, 0, -1.0); pivot.rotation.set(0, 0, 0); pivot.scale.setScalar(1);
    grid.visible = true; applyBackground(); renderer.setClearAlpha(1);
    $('ui').hidden = false; resize(); applyCam();
  });

  async function startXR(mode) {
    if (!navigator.xr) { say('WebXR не поддерживается этим браузером. Откройте страницу в браузере Quest 3.'); return; }
    try {
      xr.mode = mode;
      renderer.xr.setReferenceSpaceType('local-floor');
      var session;
      try {
        session = await navigator.xr.requestSession(mode, { optionalFeatures: ['local-floor', 'bounded-floor'] });
      } catch (e1) {
        session = await navigator.xr.requestSession(mode);
      }
      await renderer.xr.setSession(session);
    } catch (e) {
      xr.mode = null;
      say('Не удалось запустить ' + (mode === 'immersive-ar' ? 'AR' : 'VR') + ': ' + (e && e.message ? e.message : e));
    }
  }
  $('btn-ar').addEventListener('click', function () { startXR('immersive-ar'); });
  $('btn-vr').addEventListener('click', function () { startXR('immersive-vr'); });

  function detectXR() {
    if (!navigator.xr || !navigator.xr.isSessionSupported) {
      $('btn-ar').disabled = true; $('btn-vr').disabled = true;
      return;
    }
    navigator.xr.isSessionSupported('immersive-ar').then(function (ok) {
      $('btn-ar').disabled = !ok;
    }).catch(function () { $('btn-ar').disabled = true; });
    navigator.xr.isSessionSupported('immersive-vr').then(function (ok) { $('btn-vr').disabled = !ok; })
      .catch(function () { $('btn-vr').disabled = true; });
  }
  detectXR();

  // ---------- цикл ----------
  var clock = new T.Clock();
  renderer.setAnimationLoop(function () {
    var dt = Math.min(clock.getDelta(), 0.1);
    if (asm.playing) updateAsm(dt);
    if (renderer.xr.isPresenting) xrFrame(dt);
    renderer.render(scene, camera);
  });
}
</script>

    'https://unpkg.com/three@0.159.0/build/three.min.js'
  ];
  var st = document.getElementById('status');
  function next(i) {

    var s = document.createElement('script');
    s.src = urls[i]; s.onload = function () { next(i); }; s.onerror = function () { next(i + 1); };
    document.head.appendChild(s);
  }
